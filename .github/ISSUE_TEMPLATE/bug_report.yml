name: Something is wrong
description: >-
  A header reads the wrong thing, a checksum comes out wrong, or nothing
  works at all
labels: ["bug"]
body:
  - type: textarea
    id: doctor
    attributes:
      label: What the doctor says
      description: |
        Run this from the repository and paste every line, including the ones
        that did not pass. Those are the ones worth reading, so do not trim it.

        macOS and Linux:

            python3 smsimage/doctor.py

        Windows, whichever of these resolves:

            python smsimage/doctor.py
            py -3 smsimage/doctor.py

        It reports the machine as well as the package, so most answers are in
        there already. If it will not run at all, say so here and paste whatever
        it printed instead.
      render: text
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Almost every report here is about one cartridge, and almost every one of
        those is settled by a few numbers: its length, where the header was
        found, and what the checksum came out as. The fields below ask for them
        so nobody has to guess.

        Never attach a cartridge and never link to one. Its SHA-256 identifies
        it exactly, and that is all anybody needs.

  - type: textarea
    id: identity
    attributes:
      label: What the file is
      description: |
        Run this from the repository and paste all of it. It reads only lengths,
        digests and header fields, and it prints no part of the cartridge.
      render: text
      placeholder: |
        python3 -c "
        from pathlib import Path
        from smsimage import dump, header, identity
        raw = Path('YOUR FILE').read_bytes()
        image = dump.strip_copier_stub(raw)
        print(dict(identity.measure(image)))
        print('form', dump.form(raw))
        print('anchors', [hex(at) for at in header.anchors_in(image)])
        print('region', header.region_of(image))
        print('declared', header.declared_size(image))
        print('carried', header.carried(image))
        print('computed', header.checksum(image))"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: |
        the computed checksum should match the one the cartridge carries, 0xBA33
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened instead
      description: |
        The exact output or the whole traceback. Paste it rather than describing
        it: a summary of an error loses the part that identifies it.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: The shortest thing that shows it
      description: Python we can run as it stands, with no editing.
      render: python
      placeholder: |
        from smsimage import dump, header

        image = dump.read("game.sms")
        print(header.agrees(image))
    validations:
      required: true

  - type: input
    id: cartridge
    attributes:
      label: The cartridge, if one is involved
      description: |
        Its name, its region, and its SHA-256. Never attach the file itself, and
        never link to somewhere it can be downloaded.
      placeholder: "Alex Kidd in Miracle World (USA, Europe), sha256 ..."

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: The output above is complete rather than trimmed
          required: true
        - label: I own anything I am naming, and I have attached none of it
          required: true
