[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smsimage"
description = "A Sega Master System, Game Gear and SG-1000 cartridge image as a file: what the dumper added, what the header declares, and how to change it safely."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
keywords = [
  "sega",
  "master-system",
  "game-gear",
  "sg-1000",
  "rom-header",
  "cartridge",
  "checksum",
  "retrocomputing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Emulators",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/gufranco/sms-rom-image-python"
Source = "https://github.com/gufranco/sms-rom-image-python"
Issues = "https://github.com/gufranco/sms-rom-image-python/issues"

[project.scripts]
smsimage-doctor = "smsimage.doctor:main"

[tool.setuptools]
packages = ["smsimage"]

[tool.setuptools.dynamic]
version = { attr = "smsimage.version.VERSION" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "BLE", "C4", "N", "A", "T20", "PTH"]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLC0415",
  "PLR0917",
  "E501",
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"smsimage/environment.py" = ["BLE001", "T201"]
"*.test.py" = ["PLR2004", "N999"]
"conformance/*.py" = ["T201"]
"smsimage/doctor.py" = ["BLE001", "T201"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["smsimage", "conformance"]

[tool.coverage.run]
source = ["."]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
  'if __name__ == "__main__":',
  'if TYPE_CHECKING:',
  '^\s*\.\.\.$',
  ': \.\.\.$',
]
